[project]
name = "modsmith-cli"
version = "0.1.1"
description = "Install Minecraft modpacks and mods for the official launcher."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "MeNeither", email = "pengyufeng2003@outlook.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "modsmith>=0.3.5,<0.4",
    "platformdirs>=4.3",
    "rich>=13.9",
    "tomli-w>=1.1",
    "typer>=0.15",
]

[project.scripts]
modsmith = "modsmith_app.cli:main"

[project.urls]
Homepage = "https://modsmithmc.org/"
Source = "https://github.com/ModsmithMC/modsmith"
Documentation = "https://modsmithmc.org/modsmith/"
Issues = "https://github.com/ModsmithMC/modsmith/issues"

[dependency-groups]
test = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
]
lint = [
    "pre-commit>=4.0",
    "ruff>=0.8",
]
typing = [
    "pyright>=1.1.390",
]
docs = [
    "modsmith-sphinx-theme",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.1",
]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# The theme of all of Modsmith's sites, kept with the home page.
modsmith-sphinx-theme = { git = "https://github.com/ModsmithMC/modsmithmc.github.io", subdirectory = "theme" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modsmith_app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "9.0"
strict = true
testpaths = ["tests/unit", "tests/functional"]
pythonpath = ["."]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["modsmith_app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["B", "C4", "C90", "D", "E", "F", "I", "PT", "PTH", "RUF", "SIM", "T20", "UP"]
ignore = ["D105", "D107", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["modsmith_app", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["modsmith_app"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
